<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#fdfcf8"/><rect width="22" height="720" fill="#2f6f6a"/><text id="r1" x="96" y="150" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#1f2a33">The update rule</text><rect id="r2" x="220" y="210" width="840" height="170" rx="18" fill="#f1efe6" stroke="#2f6f6a" stroke-width="3"/><text x="640" y="322" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="84" fill="#1f2a33">θ ← θ − η ∇L(θ)</text><text id="r3" x="120" y="476" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" fill="#1f2a33"><tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" fill="#2f6f6a">θ</tspan><tspan dx="22">the parameters we are tuning</tspan></text><text id="r4" x="120" y="548" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" fill="#1f2a33"><tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" fill="#2f6f6a">η</tspan><tspan dx="22">learning rate: the size of each step</tspan></text><text id="r5" x="120" y="620" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" fill="#1f2a33"><tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" fill="#2f6f6a">∇L(θ)</tspan><tspan dx="22">gradient: points uphill</tspan></text></svg>
